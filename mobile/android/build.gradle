buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.0.12077973"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Native dependencies also need the short staging root on Windows. This keeps
// their generated objects out of deeply nested node_modules paths.
subprojects { nativeProject ->
    nativeProject.plugins.withId("com.android.library") {
        def shortRoot = rootProject.findProperty("nexaNativeBuildDir")
        if (shortRoot && System.getProperty("os.name").toLowerCase().contains("windows")) {
            nativeProject.extensions.getByName("android").externalNativeBuild.cmake.buildStagingDirectory =
                new File(shortRoot.toString(), nativeProject.name)
        }
    }
}
