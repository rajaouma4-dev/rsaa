# Coturn TURN/STUN Server Configuration for Nexa Chat
listening-port=3478
tls-listening-port=5349

realm=turn.example.com
server-name=turn.example.com

lt-cred-mech
user=nexa:change_me

# SSL / TLS configuration
cert=/etc/ssl/certs/signaling.crt
pkey=/etc/ssl/private/signaling.key

# WebRTC relay ports range
min-port=49152
max-port=65535

# Logging & Security
verbose
fingerprint
no-cli
no-tcp-relay
stale-nonce
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
