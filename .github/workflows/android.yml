name: Validate and build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: nexa-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - name: Compile and test Rust backend
        working-directory: backend
        run: |
          cargo check --locked
          cargo test --locked
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13' 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0" "ndk;27.0.12077973"
      - name: Generate native Android shell
        run: bash scripts/bootstrap-native.sh
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Validate project SQL and TypeScript syntax
        run: |
          node scripts/validate-typescript.cjs
          python3 scripts/test-db-schema.py
      - name: TypeScript semantic check
        working-directory: mobile
        run: npm run typecheck
      - name: Encryption, session and call regressions
        working-directory: mobile
        run: |
          node test-native-crypto.cjs
          node test-e2ee-security.cjs
          node test-e2ee-upgrade.cjs
          node test-session-recovery.cjs
          node test-storage-concurrency.cjs
          node test-low-latency.cjs
          node test-realtime-reliability.cjs
          node test-call-multi-user.cjs
      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-chat-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
